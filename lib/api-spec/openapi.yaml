openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: extraction
    description: Webpage extraction operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /extract:
    post:
      operationId: extractWebpage
      tags: [extraction]
      summary: Extract workbook-ready data from a webpage
      description: Fetches a public webpage or interprets pasted webpage text and identifies useful tabular, list, product, article, or structured data to suggest workbook sheets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractWebpageInput"
      responses:
        "200":
          description: Extracted workbook suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractionResult"
        "400":
          description: Invalid URL or unsupported request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The target page could not be fetched or understood
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ExtractWebpageInput:
      type: object
      properties:
        url:
          type: string
          minLength: 8
        text:
          type: string
          minLength: 20
          maxLength: 250000
        sourceTitle:
          type: string
          maxLength: 240
        maxRows:
          type: number
          minimum: 1
          maximum: 500
          default: 100
    ExtractionCell:
      type: ["string", "number", "boolean", "null"]
    ExtractionSheet:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        confidence:
          type: number
          minimum: 0
          maximum: 1
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              $ref: "#/components/schemas/ExtractionCell"
        source:
          type: string
      required:
        - id
        - name
        - description
        - confidence
        - headers
        - rows
        - source
    ExtractionResult:
      type: object
      properties:
        sourceUrl:
          type: string
        title:
          type: string
        description:
          type: string
        fetchedAt:
          type: string
          format: date-time
        pageType:
          type: string
        sheets:
          type: array
          items:
            $ref: "#/components/schemas/ExtractionSheet"
      required:
        - sourceUrl
        - title
        - description
        - fetchedAt
        - pageType
        - sheets
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

